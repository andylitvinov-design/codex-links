name: Codex Save Security

on:
  pull_request:
    paths:
      - "codex-save/**"
      - "tests/codex-save-*.test.mjs"
      - ".github/workflows/codex-save-security.yml"

jobs:
  remediation-auth:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Codex Save remediation security tests
        run: node --test tests/codex-save-remediation.test.mjs
