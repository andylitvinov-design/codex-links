name: Validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: UI error visibility regression
        run: node --test tests/app-status-visibility.test.mjs

      - name: Cloud setup check
        run: npm run cloud:check

      - name: Release smoke check
        run: npm run smoke:release
