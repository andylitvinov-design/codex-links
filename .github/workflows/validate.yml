name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      # Anonymous exact-event checkout keeps all files without persisting credentials.
      # actions/checkout credential cleanup rejects this repo's historical .tmp gitlinks.
      - name: Checkout exact public repository commit anonymously
        shell: bash
        env:
          CHECKOUT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/codex-links-git-home"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/codex-links-git-home" \
            GIT_CONFIG_NOSYSTEM=1 GIT_TERMINAL_PROMPT=0 CHECKOUT_SHA="$CHECKOUT_SHA" \
            /bin/bash --noprofile --norc -euo pipefail -c '
              [[ "$CHECKOUT_SHA" =~ ^[0-9a-f]{40}$ ]]
              test ! -e .git
              git init .
              git remote add origin https://github.com/andylitvinov-design/codex-links.git
              git -c credential.helper= -c protocol.version=2 fetch --no-tags --no-recurse-submodules --depth=1 origin "$CHECKOUT_SHA"
              git -c advice.detachedHead=false checkout --detach FETCH_HEAD
              test "$(git rev-parse HEAD)" = "$CHECKOUT_SHA"
            '

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Offline delivery and status regressions
        run: node --import ./tests/helpers/no-external-effects.mjs --test tests/app-status-visibility.test.mjs tests/delivery-polling.test.mjs tests/messages-storage.test.mjs tests/status-bridge-health.test.mjs tests/cloud-setup-offline.test.mjs

      - name: Cloud setup check (offline fixtures)
        run: node --import ./tests/helpers/no-external-effects.mjs scripts/check-cloud-setup.mjs --offline

      - name: Release smoke check
        run: npm run smoke:release

  browser-acceptance:
    # Temporary explicit image: preserve sandboxed Chromium without changing host security.
    # Revisit this pin before the ubuntu-22.04 runner retirement.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # Anonymous exact-event checkout keeps all files without persisting credentials.
      # actions/checkout credential cleanup rejects this repo's historical .tmp gitlinks.
      - name: Checkout exact public repository commit anonymously
        shell: bash
        env:
          CHECKOUT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/codex-links-git-home"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/codex-links-git-home" \
            GIT_CONFIG_NOSYSTEM=1 GIT_TERMINAL_PROMPT=0 CHECKOUT_SHA="$CHECKOUT_SHA" \
            /bin/bash --noprofile --norc -euo pipefail -c '
              [[ "$CHECKOUT_SHA" =~ ^[0-9a-f]{40}$ ]]
              test ! -e .git
              git init .
              git remote add origin https://github.com/andylitvinov-design/codex-links.git
              git -c credential.helper= -c protocol.version=2 fetch --no-tags --no-recurse-submodules --depth=1 origin "$CHECKOUT_SHA"
              git -c advice.detachedHead=false checkout --detach FETCH_HEAD
              test "$(git rev-parse HEAD)" = "$CHECKOUT_SHA"
            '

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Lock captured from CI414 official npm resolution; never run lifecycle scripts.
      - name: Install locked browser dependency and record integrity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/codex-links-browser-home" browser-acceptance-results
          : > "$RUNNER_TEMP/codex-links-npm-user.conf"
          : > "$RUNNER_TEMP/codex-links-npm-global.conf"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/codex-links-browser-home" \
            NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/codex-links-npm-user.conf" \
            NPM_CONFIG_GLOBALCONFIG="$RUNNER_TEMP/codex-links-npm-global.conf" \
            npm ci --prefix tests/browser --ignore-scripts --no-audit --no-fund \
              --registry=https://registry.npmjs.org
          node tests/browser/verify-dependencies.mjs
          cp tests/browser/package-lock.json browser-acceptance-results/package-lock.json

      - name: Install pinned Chromium and official runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/codex-links-browser-home" \
            PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/codex-links-browser-binaries" \
            node tests/browser/node_modules/playwright/cli.js install --with-deps chromium

      # Only loopback exists during application execution. Run Chromium as the normal
      # runner user, keep its sandbox enabled, and fail if the runner cannot support it.
      - name: Real browser acceptance with external network absent
        shell: bash
        run: |
          set -euo pipefail
          sudo unshare --net -- /bin/bash -c '
            set -euo pipefail
            ip link set lo up
            exec runuser --user "$1" -- env -i PATH="$2" HOME="$3" \
              PLAYWRIGHT_BROWSERS_PATH="$4" \
              xvfb-run -a -s "-screen 0 1280x900x24 -nolisten tcp" \
              node tests/browser/acceptance.mjs
          ' acceptance "$(id -un)" "$PATH" "$RUNNER_TEMP/codex-links-browser-home" "$RUNNER_TEMP/codex-links-browser-binaries"

      - name: Upload synthetic acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-acceptance-${{ github.sha }}
          path: browser-acceptance-results/
          if-no-files-found: warn
          retention-days: 7

  full-unit-suite:
    # Loopback is needed only by three synthetic local-vault HTTP tests.
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Anonymous exact-event checkout keeps all files without persisting credentials.
      # actions/checkout credential cleanup rejects this repo's historical .tmp gitlinks.
      - name: Checkout exact public repository commit anonymously
        shell: bash
        env:
          CHECKOUT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/codex-links-git-home"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/codex-links-git-home" \
            GIT_CONFIG_NOSYSTEM=1 GIT_TERMINAL_PROMPT=0 CHECKOUT_SHA="$CHECKOUT_SHA" \
            /bin/bash --noprofile --norc -euo pipefail -c '
              [[ "$CHECKOUT_SHA" =~ ^[0-9a-f]{40}$ ]]
              test ! -e .git
              git init .
              git remote add origin https://github.com/andylitvinov-design/codex-links.git
              git -c credential.helper= -c protocol.version=2 fetch --no-tags --no-recurse-submodules --depth=1 origin "$CHECKOUT_SHA"
              git -c advice.detachedHead=false checkout --detach FETCH_HEAD
              test "$(git rev-parse HEAD)" = "$CHECKOUT_SHA"
            '

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Built-in Node tests need no npm install and receive no provider secrets.
      - name: Run all tracked unit tests in isolated fixture environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/codex-links-unit-home" "$RUNNER_TEMP/codex-links-unit-tmp" full-unit-results
          test ! -e /tmp/claude-does-not-exist
          printf 'event_sha=%s\nnode=%s\n' "$(git rev-parse HEAD)" "$(node --version)" > full-unit-results/environment.txt
          sudo unshare --net -- /bin/bash -c '
            set -euo pipefail
            ip link set lo up
            exec runuser --user "$1" -- env -i PATH="$2" HOME="$3" TMPDIR="$4" \
              NODE_OPTIONS="--import=$5/tests/helpers/offline-suite-guard.mjs" \
              OFFLINE_GUARD_LOG="$5/full-unit-results/blocked-effects.txt" \
              /bin/bash --noprofile --norc -euo pipefail -c "node --test --test-reporter=tap tests/*.test.mjs"
          ' full-unit "$(id -un)" "$PATH" "$RUNNER_TEMP/codex-links-unit-home" "$RUNNER_TEMP/codex-links-unit-tmp" "$PWD" \
            2>&1 | tee full-unit-results/suite.tap

      - name: Upload full unit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-unit-${{ github.sha }}
          path: full-unit-results/
          if-no-files-found: error
          retention-days: 7
