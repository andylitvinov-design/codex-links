name: One-shot Codex Links KV Recovery Release

# Only the explicitly approved PR #184 merge can dispatch the existing,
# already hardened exact-SHA deployment workflow. No standalone deploy steps.
on:
  push:
    branches: [main]
    paths:
      - ops/releases/codex-links-kv-20261020.release

permissions:
  actions: write
  contents: read

jobs:
  release:
    if: ${{ github.repository == 'andylitvinov-design/codex-links' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release(codex-links): KV polling budget #184') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch existing production fallback for exact pushed merge commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXACT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXACT_SHA" =~ ^[0-9a-f]{40}$ ]]
          gh workflow run deploy-production.yml \
            --repo andylitvinov-design/codex-links \
            --ref main \
            -f ref=main \
            -f expected_sha="$EXACT_SHA" \
            -f reason="2026-10-20 authorized Codex Links KV budget recovery PR 184"
          echo "Exact-SHA production workflow dispatch requested for $EXACT_SHA"
