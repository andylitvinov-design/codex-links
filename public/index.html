<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codex Links</title>
    <meta name="theme-color" content="#0f766e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Codex Links" />
    <script>
      (function () {
        var build = "20260422-0320";
        var current = new URL(window.location.href);
        var requested = String(current.searchParams.get("v") || "").trim();
        if (requested === build) {
          return;
        }
        current.searchParams.set("v", build);
        current.searchParams.set("reload", String(Date.now()));
        window.location.replace(current.toString());
      })();
    </script>
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/styles.css?v=20260422-0320" />
  </head>
  <body>
    <main class="page">
      <section class="chat-shell">
        <header class="chat-header">
          <h1>Ссылки</h1>
          <div class="header-controls">
            <div class="header-actions">
              <a class="button button-secondary header-link-button" href="/projects.html">Projects</a>
              <a class="button button-secondary header-link-button" href="/advice.html">Advice</a>
              <a class="button button-secondary header-link-button" href="/analysis.html">Анализ</a>
              <button class="button button-secondary refresh-button" id="refresh-button" type="button">Refresh</button>
            </div>
            <a class="button button-primary header-projects-button" href="/projects.html">Мои проекты</a>
          </div>
        </header>
        <section class="bridge-status-block">
          <div class="bridge-status-row">
            <div class="bridge-status-copy">
              <p id="bridge-status-text" class="bridge-status">Подключаю статус cloud execution…</p>
              <p id="bridge-watchdog-text" class="bridge-watchdog">Watchdog: загружаю состояние исполнителя…</p>
            </div>
          </div>
        </section>

        <section class="command-wrap">
          <form id="command-form" class="command-form">
            <div class="thread-settings-inline-row">
              <span id="thread-settings-summary" class="form-status">Показываются все репозитории.</span>
            </div>
            <section id="thread-settings-panel" class="thread-settings-panel" hidden>
              <label>
                <span class="field-label">Поиск по чатам</span>
                <input id="thread-settings-search" type="search" placeholder="Название категории или репозитория" />
              </label>
              <section class="thread-categories">
                <div class="thread-categories-top">
                  <span class="field-label">Категории</span>
                  <span id="thread-categories-summary" class="form-status"></span>
                </div>
                <div id="thread-categories-list" class="thread-categories-list" aria-live="polite"></div>
              </section>
              <div class="thread-settings-actions">
                <button class="button button-secondary" id="thread-settings-select-all" type="button">Показать все</button>
                <button class="button button-secondary" id="thread-settings-clear" type="button">Сбросить фильтр</button>
                <button class="button button-secondary" id="thread-settings-save" type="button">Закрыть</button>
              </div>
              <div id="thread-settings-list" class="thread-settings-list" aria-live="polite"></div>
            </section>
            <div class="command-photo-row">
              <label class="command-photo-field">
                <span class="field-label">Фото</span>
                <input id="command-photo-input" name="photo" type="file" accept="image/*" />
              </label>
              <button class="button button-secondary command-photo-clear" id="command-photo-clear" type="button" disabled aria-label="Удалить фото" title="Удалить фото">x</button>
            </div>
            <p id="command-photo-status" class="form-status command-photo-status">Фото не выбрано.</p>
            <section id="project-nav" class="project-nav project-nav-inline" aria-label="Проекты из dispatch manifest">
              <label class="thread-select-field project-nav-field">
                <span class="field-label" id="command-target-label">Проект</span>
                <select id="command-thread-select" name="thread"></select>
              </label>
            </section>
            <div class="command-compose-row">
              <textarea id="command-input" name="command" rows="2" placeholder="Сообщение для Codex" autocomplete="off" autocorrect="off" autocapitalize="sentences" spellcheck="true"></textarea>
              <button class="button button-secondary command-voice-button" id="command-voice-button" type="button" aria-label="Голосовой ввод" title="Голосовой ввод">
                <span aria-hidden="true">Mic</span>
              </button>
              <button class="button button-send-icon" type="submit" aria-label="Отправить в Codex" title="Отправить в Codex">
                <span aria-hidden="true">▶</span>
              </button>
            </div>
            <p id="command-voice-status" class="form-status command-voice-status" hidden>Голосовой ввод готов.</p>
            <div class="dispatch-toggle dispatch-toggle-inline" id="dispatch-toggle" role="tablist" aria-label="Режим отправки">
              <button class="dispatch-toggle-button is-active" id="dispatch-mode-bridge" type="button" data-mode="bridge" role="tab" aria-selected="true">
                <span class="dispatch-toggle-lamp" aria-hidden="true"></span>
                <span>Bridge</span>
              </button>
              <button class="dispatch-toggle-button" id="dispatch-mode-cloud" type="button" data-mode="cloud" role="tab" aria-selected="false">
                <span class="dispatch-toggle-lamp" aria-hidden="true"></span>
                <span>Codex Cloud</span>
              </button>
              <button class="dispatch-toggle-button" id="dispatch-mode-claude" type="button" data-mode="claude" role="tab" aria-selected="false">
                <span class="dispatch-toggle-lamp" aria-hidden="true"></span>
                <span>Claude</span>
              </button>
            </div>
            <div class="dispatch-subtoggle" id="cloud-route-toggle" hidden>
              <button class="dispatch-subtoggle-button is-active" id="cloud-route-slack" type="button" data-route="cloud-via-slack">via Slack</button>
              <button class="dispatch-subtoggle-button" id="cloud-route-direct" type="button" data-route="direct-openai">direct OpenAI</button>
            </div>
            <div class="command-actions">
              <span id="command-status" class="form-status" aria-live="polite"></span>
              <div class="submit-progress-wrap">
                <div id="submit-progress" class="submit-progress" aria-live="polite" aria-label="Стадия обработки запроса">
                  <span class="submit-progress-dot"></span>
                  <span class="submit-progress-dot"></span>
                  <span class="submit-progress-dot"></span>
                  <span class="submit-progress-dot"></span>
                  <span class="submit-progress-dot"></span>
                </div>
              </div>
            </div>
          </form>
          <nav class="timeline-tabs" aria-label="Меню чатов">
            <button class="timeline-tab-button is-active" id="timeline-tab-dialog" type="button" data-tab="dialog">Диалоги</button>
            <button class="timeline-tab-button" id="timeline-tab-notifications" type="button" data-tab="notifications">Уведомления</button>
            <button class="timeline-tab-button" id="timeline-tab-reports" type="button" data-tab="reports">Отчёты</button>
          </nav>
          <div id="command-timeline" class="command-timeline" aria-live="polite"></div>
        </section>

      </section>
    </main>

    <script type="module" src="/app.js?v=20260422-0320"></script>
  </body>
</html>
